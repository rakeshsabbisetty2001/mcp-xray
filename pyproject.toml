[project]
name = "mcp-xray"
version = "0.1.0"
description = "MCP security red-team harness — scans an MCP server for prompt injection, over-permissioned tools, secret leaks, and schema-confusion vulnerabilities"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [
    { name = "raksab01", email = "rakeshsabbisetty@gmail.com" }
]
keywords = ["mcp", "model-context-protocol", "security", "red-team", "prompt-injection", "llm-security"]
requires-python = ">=3.12"
dependencies = [
    "anthropic>=1.3.0",
    "mcp>=2.1.1",
    "pydantic>=2.13.5",
    "pyyaml>=6.0.3",
    "rich>=15.0.0",
]

[project.urls]
Repository = "https://github.com/raksab01/mcp-xray"

[project.scripts]
mcp-xray = "mcp_xray.cli:main"

[build-system]
requires = ["uv_build>=0.12.0,<0.13.0"]
build-backend = "uv_build"
