# Ground truth for the ACTIVE half of category D and all of category E,
# against fixtures/vulnerable/server.py. Separate from ground_truth.yaml
# (passive B/C/G) because category D's structural half legitimately fires on
# BOTH fixtures (a schema-shape signal, not proof — see permissions.py) so it
# can't share the "hardened = 0 findings" precision baseline the passive
# categories use. scripts/eval_active.py reads this file.
#
# Caveat (same as ground_truth.yaml): authored, then checked against this
# fixture — in-distribution only, not a generalization estimate.

expected:
  - category: D
    target: read_file
    field: unix_traversal
    note: unix path traversal escape (fake /etc/passwd content) — windows_traversal payload intentionally produces no separate finding (pinned via `field` so a regression that made windows_traversal also fire wouldn't be silently absorbed as the same TP), since this fixture's read_file doesn't distinguish payload shape, only "contains .."

  - category: D
    target: fetch_url
    field: aws_metadata_endpoint
    note: SSRF to the AWS instance-metadata endpoint

  - category: D
    target: fetch_url
    field: localhost_port_scan
    note: SSRF to a local port (fake SSH banner)

  - category: D
    target: fetch_url
    field: file_scheme
    note: SSRF via file:// scheme

  - category: E
    target: debug_status
    field: aws_access_key
    note: bait value 'config' elicits a fake AWS key in the response

  - category: E
    target: debug_status
    field: openai_key
    note: same bait call also contains a fake OpenAI-shaped key — both patterns match one response, one Finding each

  - category: F
    target: process_item
    field: empty_object_for_object
    note: >
      schema-valid empty object crashes a naive item['name'] lookup; caught
      and re-surfaced via ToolError with a leaked internal path.
      Type-MISMATCH payloads (number-for-string etc.) are all correctly
      rejected by this SDK's pydantic validation on every fixture tool —
      that's the honest "no finding" result, not a probe gap (see
      schema_confusion.py's module docstring). The "silent acceptance"
      detection branch has no live-fixture demonstration for the same
      reason (a well-typed server won't produce it) and is covered instead
      by schema_confusion.py's own _selftest() with a scripted fake
      session. The DoS-smell (oversized-string timeout) check similarly has
      no fixture coverage — demonstrating it would require an intentionally
      slow tool, which would slow down this eval script; deliberately
      deferred, not missed.
