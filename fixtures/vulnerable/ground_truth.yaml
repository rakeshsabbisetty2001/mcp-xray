# Ground truth for fixtures/vulnerable/server.py — every finding mcp-xray's
# current passive probes (B, C, G) SHOULD produce against this server.
# fixtures/hardened/server.py has the same tool/resource/prompt surface with
# no entries here — it's the false-positive baseline (should score 0).
#
# Caveat (Round 2 plan review): this catalog was authored, then checked
# against the fixture below — not tuned to match probe output after the fact.
# Any precision/recall measured against this single fixture pair is
# IN-DISTRIBUTION ONLY, not a generalization estimate.

expected:
  - category: C
    target: summarize_document
    note: top-level tool description poisoning ("ignore previous instructions", "call the ... tool")

  - category: C
    target: lookup_user
    field: param.filters[].field
    note: nested poisoning behind a $ref (pydantic model field description) — regression fixture for the $defs-resolution bug found 2026-09-02. `field` is pinned so this stays a real regression check — without it, any other finding on lookup_user would count as a false TP if $ref resolution broke again.

  - category: B
    target: readme
    note: resource content poisoning

  - category: B
    target: daily_summary
    note: prompt description poisoning

  - category: G
    target: read_note
    note: internal path leaked via an anticipated ToolError message, not a crash — the SDK masks unhandled-exception detail by default, so this models a developer re-surfacing internal detail on purpose, not a framework bug

  - category: G
    target: process_item
    note: >
      incidental cross-category overlap, added when category F's fixture
      tool was built — G's benign default-arg call for a required `dict`
      param is `{}` (tool_args.default_for), which happens to be exactly
      F's `empty_object_for_object` payload too. G legitimately catches
      the same leak from a "benign" call that F catches from a "malformed"
      one; this isn't a probe bug, it's two probes correctly agreeing on
      one real bug via two different trigger paths — verified this is a
      property of THIS fixture, not general duplication: a `dict` param
      with `required` sub-keys of its own (a nested pydantic model, not a
      bare `dict`) would give G a different, schema-valid minimal object
      than F's deliberately-empty one, and the two would diverge. See
      fixtures/vulnerable/ground_truth_active.yaml for F's own entry.
