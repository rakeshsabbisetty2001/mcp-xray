    target: summarize_document
    note: top-level tool description poisoning ("ignore previous instructions", "call the ... tool")

  - category: C
    target: lookup_user
    note: nested poisoning behind a $ref (pydantic model field description) — regression fixture for the $defs-resolution bug found 2026-09-02

  - category: B
    target: readme
    note: resource content poisoning

  - category: B
    target: daily_summary
    note: prompt description poisoning

  - category: G
    target: read_note
