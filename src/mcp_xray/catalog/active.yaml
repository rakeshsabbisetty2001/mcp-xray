# Active probe catalog — sends a crafted payload to the target and/or expects
# a state-adjacent effect. Gated behind CLI --authorized (Round 1 review §2);
# every probe here is used only against locally stdio-spawned processes in
# this CLI — there is no remote-host transport built yet (plan §1
# out-of-scope), so the Round 2 review's "refuse non-localhost unless
# --allow-remote" rule has nothing to gate yet at the TRANSPORT level.
# Deferred, not forgotten — add --allow-remote when HTTP/SSE transport exists.
#
# That transport-level deferral does NOT cover the real remaining risk: the
# SSRF payloads' danger is about the SCANNER's network position, not the
# target's transport. Running --authorized's SSRF probe against a vulnerable
# fetch_url-shaped tool on a cloud instance makes that instance fetch ITS
# real metadata credentials — regardless of how the target was reached. See
# README's Safety section.
#
# Category D (over-broad permissions), E (secret exfiltration), F (schema
# confusion / input validation).

ssrf_payloads:
  # Sent to any tool whose schema names/types suggest it accepts a URL.
  # Detection is signature-based on the RESPONSE, not just "we sent it" —
  # a tool that validates and rejects these is not a finding.
  - id: aws_metadata_endpoint
    value: "http://169.254.169.254/latest/meta-data/"
    severity: critical
  - id: localhost_port_scan
    value: "http://localhost:22"
    severity: high
  - id: file_scheme
    value: "file:///etc/passwd"
    severity: high

path_traversal_payloads:
  # Sent to any tool whose schema names/types suggest it accepts a filesystem
  # path. Detection looks for known escape signatures in the response
  # (/etc/passwd's "root:x:0:0", win.ini's "[fonts]") — heuristic against a
  # real unknown target's actual file contents, exact against this project's
  # own fixtures where the content is known. Documented ceiling, not silent.
  - id: unix_traversal
    value: "../../../../etc/passwd"
    severity: high
  - id: windows_traversal
    value: "..\\..\\..\\..\\windows\\win.ini"
    severity: high

# Param name/type heuristics for the structural (passive-safe, no call made)
# half of category D — flags a tool as arbitrary-execution-risk-shaped before
# any payload is sent. Kept in this file rather than passive.yaml because it
# shares category D with the active checks above, even though this specific
# check makes no call and needs no --authorized gate.
risky_param_names:
  - path
  - file
  - filepath
  - cmd
  - command
  - query
  - sql
  - exec
  - url

secret_patterns:
  # Same shape as passive.yaml's instruction_patterns, different job: these
  # match actual credential material, not instruction text — so a hit here
  # is redacted before it ever becomes a Finding (probes/patterns.py's
  # redact_secrets()), unlike
  # B/C/G's evidence which is safe to show in full.
  - id: aws_access_key
    pattern: 'AKIA[0-9A-Z]{16}'
    severity: critical
  - id: github_token
    pattern: 'gh[pousr]_[A-Za-z0-9]{36,}'
    severity: critical
  - id: openai_key
    pattern: 'sk-[A-Za-z0-9]{20,}'
    severity: critical
  - id: jwt
    pattern: 'eyJ[A-Za-z0-9_-]+\.[A-Za-z0-9_-]+\.[A-Za-z0-9_-]+'
    severity: high
  - id: private_key_header
    pattern: '-----BEGIN (RSA |EC |OPENSSH |DSA |)PRIVATE KEY-----'
    severity: critical

secret_bait_values:
  # Tried as the value of any required string arg on a read-only tool, to see
  # if the tool dumps config/env/debug info that happens to contain a secret.
  # Bait, not exploitation — no auth bypass, no injection, just plausible
  # legitimate-looking argument values a curious user might try.
  - config
  - debug
  - env
  - ".env"

schema_confusion_payloads:
  # Sent in place of ONE required param at a time, replacing whatever value
  # a schema-satisfying call would normally send — deliberately the WRONG
  # JSON type for that param's declared schema type. Detection (probes/
  # schema_confusion.py) looks for two outcomes, both findings: an
  # unhandled crash that leaks internals (reuses G's leak-pattern scanner),
  # or silent acceptance (is_error=False) — a server that doesn't validate
  # its own declared schema may process the wrong type unsafely downstream,
  # even though this probe alone can't prove what that downstream does.
  - id: number_for_string
    expected_type: string
    value: 12345
    severity: medium
  - id: array_for_string
    expected_type: string
    value: ["unexpected", "array"]
    severity: medium
  - id: null_for_required
    expected_type: any   # tried against every declared type — null bypasses type-specific validation entirely
    value: null
    severity: medium
  - id: string_for_number
    expected_type: number
    value: "not_a_number"
    severity: medium
  - id: string_for_integer
    expected_type: integer
    value: "not_an_integer"
    severity: medium
  - id: string_for_boolean
    expected_type: boolean
    value: "not_a_boolean"
    severity: low
  - id: string_for_array
    expected_type: array
    value: "not_an_array"
    severity: medium
  - id: object_for_array
    expected_type: array
    value: {"unexpected": "object"}
    severity: medium
  - id: string_for_object
    expected_type: object
    value: "not_an_object"
    severity: medium
  - id: empty_object_for_object
    # Schema-valid at the top level (an "object" type param genuinely
    # getting an object) but semantically empty — a bare `{"type": "object"}`
    # JSON Schema with no `required`/`properties` sub-constraints accepts
    # this even from a well-typed pydantic server, unlike the type-mismatch
    # payloads above. Realistic trigger for a handler that naively indexes
    # into a dict param without checking the key exists first.
    expected_type: object
    value: {}
    severity: medium

# Oversized-string size for the DoS-smell check — bounded and respectful
# (plan §2: "DoS smell test (bounded, respectful)"), not an actual DoS
# attempt. 50KB is enough to surface unbounded string processing (a naive
# regex, an unindexed substring search, string concatenation in a loop)
# without meaningfully loading even a modest server.
oversized_string_chars: 50000
